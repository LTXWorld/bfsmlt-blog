<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="stylesheet" href="{{basePath}}styles.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="site-title" href="{{basePath}}index.html">{{siteTitle}}</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{basePath}}index.html">Home</a>
        <a href="{{basePath}}about/index.html">About</a>
        <a href="{{basePath}}rss.xml">RSS</a>
      </nav>
      <p class="site-subtitle">{{siteSubtitle}}</p>
    </header>

    <main>
      {{content}}
    </main>

    <footer class="site-footer">
      <p>Built with plain Node.js · No tracking, no cookies, no frameworks.</p>
    </footer>
  </div>
</body>
</html>
